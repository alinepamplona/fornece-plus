<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fornece+ | Entrar</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="pagina-login">
    <main class="card card-login">
        <h1>Fornece<span>+</span></h1><p>Entre para acessar o sistema.</p>
        <form id="form-login" novalidate>
            <div class="campo"><label for="login">Login ou código de acesso</label><input id="login" name="login" type="text" required autocomplete="username"></div>
            <div class="campo"><label for="senha">Senha</label><input id="senha" name="senha" type="password" required autocomplete="current-password"></div>
            <button type="submit">Entrar</button>
        </form>
        <p id="mensagem-login" class="mensagem" role="status" aria-live="polite"></p>
    </main>
    <script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
